[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
credits="CompatMod Team"
authors="CompatMod Team"
description='''
CompatMod v8.2.0 -- Dynamic model compatibility patcher for Forge 1.21.1.
Applies JSON-based patches to BlockModel at load time via Mixin.
Features: glass cullface fix, ambient occlusion toggle, UV correction,
safe mode, blacklist system, and transform logging.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${loader_version_range}"
